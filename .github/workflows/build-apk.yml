name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Process Project and Install Dependencies
      run: |
        unzip FondoPro-flujo-herramientas.zip
        cd FondoPro/capacitor
        npm install
        npm install @capacitor/core @capacitor/cli Android

    - name: Build Android App
      run: |
        cd FondoPro/capacitor
        npm run build --if-present
        # Crea la plataforma nativa de Android que no venía en tu ZIP
        npx cap add android
        npx cap sync
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: FondoPro/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
