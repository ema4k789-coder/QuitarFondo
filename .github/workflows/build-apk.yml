name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '11.0'

    - name: Install Dependencies
      run: |
        unzip FondoPro-main.zip
        cd FondoPro
        npm install
        npm install @capacitor/core @capacitor/cli

    - name: Build Android App
      run: |
        cd FondoPro
        npm run build --if-present
        npx cap sync || true
        if [ -d "android" ]; then
          cd android
          ./gradlew assembleDebug
        else
          echo "Error: No se encontró la carpeta de Android dentro del proyecto."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: FondoPro/android/app/build/outputs/apk/debug/app-debug.apk
