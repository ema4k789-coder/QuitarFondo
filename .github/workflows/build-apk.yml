# 1. Nombre del proceso automático en GitHub
name: Build APK

# 2. Cuándo se activa: al subir cambios a la rama "main" o de forma manual
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 3. El trabajo de compilación que se ejecutará en un servidor Linux limpio
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Paso A: Descarga tus archivos del repositorio de GitHub al servidor
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Paso B: Prepara Node.js (versión 20) en el servidor para procesar JavaScript
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Paso C: Instala Java (JDK 17) necesario para poder compilar aplicaciones de Android
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Paso D: Busca y descomprime tu ZIP e instala los paquetes necesarios (Capacitor)
    - name: Process Project and Install Dependencies
      run: |
        unzip *.zip
        TARGET_DIR=$(dirname $(find . -name package.json -not -path "*/node_modules/*" | head -n 1))
        echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
        cd $TARGET_DIR
        npm install
        npm install @capacitor/core @capacitor/cli

    # Paso E: Compila tu código web, sincroniza con Capacitor y ejecuta el compilador de Android (Gradle)
    - name: Build Android App
      run: |
        cd ${{ env.TARGET_DIR }}
        npm run build --if-present
        npx cap sync || true
        ANDROID_DIR=$(find . -name "gradlew" -not -path "*/node_modules/*" | xargs dirname | head -n 1)
        if [ -n "$ANDROID_DIR" ]; then
          cd $ANDROID_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "APK_OUTPUT_PATH=$ANDROID_DIR/$APK_PATH" >> $GITHUB_ENV
        else
          echo "Error crítico: No se encontró el entorno nativo de Android ni el archivo gradlew en el proyecto."
          exit 1
        fi

    # Paso F: Agarra el archivo .apk final generado y te lo deja listo para descargar
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.TARGET_DIR }}/${{ env.APK_OUTPUT_PATH }}
